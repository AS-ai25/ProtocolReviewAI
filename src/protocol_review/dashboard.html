<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protocol Review - live dashboard</title>
<style>
:root{--bg:#0e1420;--panel:#141c2b;--line:#26324a;--fg:#eef2f7;--mut:#9fb0c6;--acc:#5cc8ff;--grn:#7bd389;--amb:#ffc857;--red:#ff6b6b;--vio:#b89cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Segoe UI",Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0 14px 0 0}header .mut{color:var(--mut);font-size:13px}
select,input,button{background:#0e1420;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit}
button{cursor:pointer}button.primary{background:#1f4d2e;border-color:#2e7a47}button:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:14px;padding:14px 20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:200px}
section h2{margin:0 0 10px;font-size:15px;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
#summary{grid-column:1 / span 2}
.steps{display:flex;gap:6px;margin-bottom:12px}.step{flex:1;text-align:center;padding:7px 4px;border-radius:8px;background:#0e1420;border:1px solid var(--line);color:var(--mut);font-size:13px}
.step.done{color:var(--grn);border-color:#2e7a47}.step.now{color:#fff;background:#1f3a5a;border-color:var(--acc);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #5cc8ff55}50%{box-shadow:0 0 0 6px #5cc8ff00}}
.timeline{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.ev{display:grid;grid-template-columns:62px 150px 1fr;gap:10px;padding:6px 8px;border-radius:7px;background:#0e1420;border-left:4px solid var(--line)}
.ev .t{color:var(--mut);font-family:Consolas,monospace}.ev .a{font-weight:600}.ev.llm{border-left-color:var(--vio)}.ev.msg{border-left-color:var(--acc)}.ev.sys{border-left-color:var(--line);color:var(--mut)}
.ev .tok{color:var(--vio);font-family:Consolas,monospace}
.bars{display:flex;flex-direction:column;gap:8px}.bar{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:10px;font-size:13.5px}
.bar .track{height:14px;background:#0e1420;border-radius:7px;overflow:hidden;display:flex}.bar .in{background:var(--acc);height:100%}.bar .out{background:var(--vio);height:100%}
.bar .n{font-family:Consolas,monospace;color:var(--mut);text-align:right}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}.kpi{background:#0e1420;border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:120px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mut);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:15px}
.RETURNED_ADMIN{background:#4d2a2a;color:var(--red)}.PASS{background:#1f4d2e;color:var(--grn)}.NEEDS_HUMAN_REVIEW{background:#4d3a1f;color:var(--amb)}.MAJOR_CONCERNS{background:#4d2a2a;color:var(--red)}
.sumgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}.summary-text{white-space:pre-wrap;font-size:14px;color:#d7e0ec;max-height:260px;overflow:auto;background:#0e1420;border-radius:8px;padding:10px 12px}
.links a{color:var(--acc);margin-right:14px}.empty{color:var(--mut);font-style:italic}
#form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#msg{color:var(--amb);font-size:13px}
</style></head><body>
<header>
  <h1>Protocol Review · live</h1><span class="mut" id="health">…</span>
  <label class="mut">Run <select id="runs"></select></label>
  <button id="refresh">↻</button>
  <form id="form">
    <input type="file" id="file" accept="application/pdf" required>
    <input id="nct" placeholder="NCT id (optional)" size="14">
    <input id="secret" placeholder="webhook secret" size="16">
    <label class="mut"><input type="checkbox" id="force"> force scientific (evaluation)</label>
    <button class="primary" id="go">Start review</button>
  </form>
  <span id="msg"></span>
</header>
<main>
  <section id="process">
    <h2>Process · agents on the blackboard</h2>
    <div class="steps" id="steps"></div>
    <div class="timeline" id="timeline"><div class="empty">select a run</div></div>
  </section>
  <section id="tokens">
    <h2>Tokens · this run</h2>
    <div class="kpis" id="kpis"></div>
    <div class="bars" id="bars"></div>
    <h2 style="margin-top:16px">Across the four review types</h2>
    <div class="mut" style="font-size:12px;margin-bottom:6px">ablation runs (abl-*) · per run averages</div>
    <table id="cfg"><thead><tr><th>Review type</th><th>runs</th><th>calls/run</th><th>tokens in/run</th><th>tokens out/run</th><th>s/run</th></tr></thead><tbody></tbody></table>
  </section>
  <section id="summary">
    <h2>Summary</h2>
    <div id="sum" class="empty">the summary appears when the run is done</div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const STEPS=[["intake","Intake + validation"],["administrative","Administrative gate"],["scientific_reviewer","Scientific reviewer"],["scientific_critic","Critic"],["revision","Revision round"],["final","Final + reports"]];
let current=null,timer=null,lastStatus="";
const fmt=n=>(n==null?"-":Number(n).toLocaleString());
const hhmm=iso=>iso?new Date(iso).toLocaleTimeString([], {hour12:false}):"--:--:--";

async function j(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.status}))).detail||r.status);return r.json();}

async function loadHealth(){try{const h=await j("/health");$("#health").textContent=`model ${h.model}${h.no_llm?" · NO LLM":""}${h.email_dry_run?" · email dry-run":""}`;}catch(e){$("#health").textContent="server unreachable";}}

async function loadRuns(keep){const runs=await j("/runs?limit=60");const sel=$("#runs");const prev=keep||sel.value;sel.innerHTML="";
  for(const r of runs){const o=document.createElement("option");o.value=r.id;o.textContent=`${r.id}  ·  ${r.status}${r.decision?" · "+r.decision:""}${r.nct_id?" · "+r.nct_id:""}`;sel.appendChild(o);}
  if(prev&&[...sel.options].some(o=>o.value===prev))sel.value=prev;current=sel.value||null;}

function stageOf(events){let stage="intake",done=new Set();for(const e of events){if(e.kind!=="message")continue;const t=(e.text||"").toLowerCase();
  if(e.agent==="coordinator"&&t.includes("forwarding to the administrative")){done.add("intake");stage="administrative";}
  else if(e.agent==="administrative"){done.add("intake");stage="administrative";}
  else if(e.agent==="scientific_reviewer"){done.add("intake");done.add("administrative");stage="scientific_reviewer";}
  else if(e.agent==="scientific_critic"){done.add("scientific_reviewer");stage="scientific_critic";}
  else if(e.agent==="coordinator"&&t.includes("re-check")){done.add("scientific_critic");stage="revision";}
  else if(e.agent==="coordinator"&&t.startsWith("final decision")){STEPS.forEach(s=>done.add(s[0]));stage="final";}}
  return {stage,done};}

function renderSteps(events,status){const {stage,done}=stageOf(events);const finished=status==="done"||status==="failed";
  $("#steps").innerHTML=STEPS.map(([k,l])=>{const cls=finished?(done.has(k)||k===stage?"done":""):(k===stage?"now":(done.has(k)?"done":""));return `<div class="step ${cls}">${l}</div>`;}).join("");}

function renderTimeline(events){const el=$("#timeline");if(!events.length){el.innerHTML='<div class="empty">no events yet</div>';return;}
  el.innerHTML=events.map(e=>e.kind==="llm_call"
    ?`<div class="ev llm"><span class="t">${hhmm(e.t)}</span><span class="a">${e.agent}</span><span>LLM call · <span class="tok">in ${fmt(e.input_tokens)} / out ${fmt(e.output_tokens)}</span> · ${Number(e.duration_s).toFixed(1)}s${e.fallback?" · FALLBACK":""}</span></div>`
    :`<div class="ev ${e.role==="agent"?"msg":"sys"}"><span class="t">${hhmm(e.t)}</span><span class="a">${e.agent}</span><span>${(e.text||"").replace(/</g,"&lt;").slice(0,260)}</span></div>`).join("");
  el.scrollTop=el.scrollHeight;}

function renderTokens(events,summary){const calls=events.filter(e=>e.kind==="llm_call");const by={};let tin=0,tout=0,dur=0;
  for(const c of calls){const b=by[c.agent]||(by[c.agent]={calls:0,in:0,out:0,s:0});b.calls++;b.in+=c.input_tokens;b.out+=c.output_tokens;b.s+=c.duration_s;tin+=c.input_tokens;tout+=c.output_tokens;dur+=c.duration_s;}
  const t0=events[0]?new Date(events[0].t):null,t1=events.length?new Date(events[events.length-1].t):null;const wall=t0&&t1?Math.round((t1-t0)/1000):0;
  $("#kpis").innerHTML=[["LLM calls",calls.length],["tokens in",fmt(tin)],["tokens out",fmt(tout)],["LLM time",dur.toFixed(0)+" s"],["wall clock",wall+" s"],["revision rounds",summary?summary.revise_rounds:"-"]].map(([l,v])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
  const max=Math.max(1,...Object.values(by).map(b=>b.in+b.out));
  $("#bars").innerHTML=Object.entries(by).sort((a,b)=>(b[1].in+b[1].out)-(a[1].in+a[1].out)).map(([a,b])=>`<div class="bar"><span>${a} <span class="mut">×${b.calls}</span></span><div class="track"><div class="in" style="width:${100*b.in/max}%"></div><div class="out" style="width:${100*b.out/max}%"></div></div><span class="n">${fmt(b.in)} / ${fmt(b.out)}</span></div>`).join("")||'<div class="empty">no LLM calls yet</div>';}

async function loadConfigTable(){try{const u=await j("/stats/usage?run=abl-&by=config");$("#cfg tbody").innerHTML=u.rows.map(r=>`<tr><td>${r.key}</td><td>${r.runs}</td><td>${(r.calls/r.runs).toFixed(1)}</td><td>${fmt(Math.round(r.input_tokens/r.runs))}</td><td>${fmt(Math.round(r.output_tokens/r.runs))}</td><td>${(r.duration_s/r.runs).toFixed(0)}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">no ablation runs in this database</td></tr>';}catch(e){}}

function renderSummary(s){if(!s||!(s.status==="done"||s.status==="failed")){$("#sum").className="empty";$("#sum").textContent=s?`run ${s.status}…`:"the summary appears when the run is done";return;}
  $("#sum").className="";const bs=s.by_status||{},bv=s.by_severity||{},bd=s.by_domain||{};const m=s.protocol_meta||{};
  $("#sum").innerHTML=`<div class="sumgrid"><div>
    <p><span class="badge ${s.decision}">${s.decision||s.status}</span> <span class="mut">${s.decision_rationale||""}</span></p>
    <div class="kpis"><div class="kpi"><b>${s.score??"-"}</b><span>score / 100</span></div><div class="kpi"><b>${s.n_findings}</b><span>findings</span></div>
      <div class="kpi"><b>${bs.verified||0}</b><span>verified</span></div><div class="kpi"><b>${bs.unverified||0}</b><span>→ human</span></div>
      <div class="kpi"><b>${(bs.rejected||0)+(bs.withdrawn||0)}</b><span>rejected / withdrawn</span></div></div>
    <table><tr><th>severity</th><td>critical ${bv.critical||0}</td><td>major ${bv.major||0}</td><td>minor ${bv.minor||0}</td><td>info ${bv.info||0}</td></tr>
      <tr><th>domain</th><td colspan="2">administrative ${bd.administrative||0}</td><td colspan="2">scientific ${bd.scientific||0}</td></tr>
      <tr><th>protocol</th><td colspan="4" style="text-align:left">${m.nct_id||s.nct_id||"-"} · ${m.page_count||"?"} pages · v${m.version||"?"} ${m.date||""} · PI ${m.principal_investigator||"-"}</td></tr>
      <tr><th>cost</th><td colspan="4" style="text-align:left">${s.cost.llm_calls} calls · ${fmt(s.cost.input_tokens)} in / ${fmt(s.cost.output_tokens)} out · ${s.cost.duration_s}s LLM${s.force_scientific?" · gate bypass (evaluation)":""}</td></tr></table>
    <p class="links">${Object.entries(s.reports).map(([k,u])=>`<a href="${u}" target="_blank">${k} report</a>`).join("")||'<span class="mut">no reports</span>'}</p>
    ${s.error?`<p style="color:var(--red)">error: ${s.error}</p>`:""}
  </div><div class="summary-text">${(s.final_summary||"(no summary)").replace(/</g,"&lt;")}</div></div>`;}

async function tick(){if(!current)return;try{const [events,summary]=await Promise.all([j(`/stats/trace/${current}`),j(`/runs/${current}/summary`)]);
  renderSteps(events,summary.status);renderTimeline(events);renderTokens(events,summary);renderSummary(summary);
  if(summary.status!==lastStatus){lastStatus=summary.status;loadRuns(current);}
  if(summary.status==="done"||summary.status==="failed"){clearInterval(timer);timer=null;loadConfigTable();}
  }catch(e){$("#msg").textContent=e.message;}}

function watch(){if(timer)clearInterval(timer);lastStatus="";tick();timer=setInterval(tick,2000);}

$("#runs").addEventListener("change",()=>{current=$("#runs").value;watch();});
$("#refresh").addEventListener("click",async()=>{await loadRuns();watch();});
$("#form").addEventListener("submit",async ev=>{ev.preventDefault();const f=$("#file").files[0];if(!f)return;$("#go").disabled=true;$("#msg").textContent="uploading…";
  const fd=new FormData();fd.append("file",f);fd.append("nct_id",$("#nct").value.trim());fd.append("source","dashboard");fd.append("submitter","dashboard");fd.append("force_scientific",$("#force").checked?"true":"false");
  try{const r=await j("/webhook/protocol",{method:"POST",body:fd,headers:{"X-Webhook-Secret":$("#secret").value}});$("#msg").textContent=`queued ${r.run_id}`;await loadRuns(r.run_id);current=r.run_id;watch();}
  catch(e){$("#msg").textContent="error: "+e.message;}finally{$("#go").disabled=false;}});

(async()=>{await loadHealth();await loadRuns();loadConfigTable();if(current)watch();})();
</script></body></html>
